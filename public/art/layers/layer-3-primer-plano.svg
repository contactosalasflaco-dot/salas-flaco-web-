<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" preserveAspectRatio="none">
  <!-- CAPA 3 · Primer plano: brochazos gruesos que enmarcan la escena.
       Fondo transparente. Igual que la capa 1: bordes con olas profundas
       y nada de pintura tocando y=1200. -->
  <defs>
    <filter id="oil3" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="4" seed="55" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="60"/>
    </filter>
  </defs>
  <g filter="url(#oil3)">
    <!-- Brochazo inferior: ondulado y roto arriba y abajo -->
    <path d="M-80 1075 Q 160 1010 400 1065 Q 640 1105 880 1040 Q 1120 995 1360 1060 Q 1600 1100 2000 1035 L 2000 1150 Q 1780 1190 1560 1148 Q 1340 1112 1120 1165 Q 900 1192 680 1150 Q 460 1114 240 1168 Q 90 1190 -80 1145 Z" fill="#1e1712" opacity="0.9"/>
    <!-- Gotas sueltas del brochazo, flotando sobre el borde -->
    <ellipse cx="380" cy="1030" rx="90" ry="13" fill="#1e1712" opacity="0.5"/>
    <ellipse cx="960" cy="1012" rx="70" ry="11" fill="#1e1712" opacity="0.45"/>
    <ellipse cx="1540" cy="1028" rx="85" ry="12" fill="#1e1712" opacity="0.5"/>
    <!-- Brochazos laterales que enmarcan -->
    <path d="M-60 -40 Q 200 120 60 360 Q -20 200 -60 -40 Z" fill="#6e1f18" opacity="0.85"/>
    <path d="M1980 -60 Q 1760 140 1900 420 Q 1990 240 1980 -60 Z" fill="#16294a" opacity="0.85"/>
  </g>
</svg>
