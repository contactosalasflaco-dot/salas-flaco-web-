<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <filter id="oil" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.05" numOctaves="4" seed="13" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="55"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="1"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.35  0 0 0 0 0.3  0 0 0 0.25 0"/>
    </filter>
  </defs>
  <rect width="800" height="800" fill="#f2e8d5"/>
  <g filter="url(#oil)">
    <ellipse cx="400" cy="380" rx="270" ry="230" fill="#a23327" opacity="0.92"/>
    <ellipse cx="300" cy="300" rx="120" ry="80" fill="#ffffff" opacity="0.22"/>
    <path d="M180 620 q 220 -60 440 0 q -220 70 -440 0 Z" fill="#1e1712" opacity="0.7"/>
  </g>
  <rect width="800" height="800" filter="url(#grain)"/>
